
name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run native firmware tests with coverage
        env:
          CXX: clang++-18
          LLVM_COV: llvm-cov-18
          LLVM_PROFDATA: llvm-profdata-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/bblanchon/ArduinoJson/archive/40ee05c065ce248192c47eb37af7a70a6935dfa6.tar.gz -o /tmp/arduinojson.tar.gz
          mkdir /tmp/arduinojson
          tar -xzf /tmp/arduinojson.tar.gz --strip-components=1 -C /tmp/arduinojson
          python3 -m unittest discover -s test/host -p 'test_*.py'
          python3 test/host/run_coverage.py --arduinojson /tmp/arduinojson/src

      - name: Run catalogue tests with coverage
        run: |
          python3 -m venv /tmp/catalogue-tests
          /tmp/catalogue-tests/bin/python -m pip install coverage reportlab
          /tmp/catalogue-tests/bin/python -m coverage run --source=docs --omit=docs/test_render_catalogues.py -m unittest discover -s docs -p 'test_*.py'
          /tmp/catalogue-tests/bin/python -m coverage xml -o coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=tundzai001
            -Dsonar.projectKey=tundzai001_esp32-base
