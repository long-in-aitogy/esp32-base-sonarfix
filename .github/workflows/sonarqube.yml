
name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run catalogue tests with coverage
        run: |
          python3 -m venv /tmp/catalogue-tests
          /tmp/catalogue-tests/bin/python -m pip install coverage reportlab
          /tmp/catalogue-tests/bin/python -m coverage run --source=docs --omit=docs/test_render_catalogues.py -m unittest discover -s docs -p 'test_*.py'
          /tmp/catalogue-tests/bin/python -m coverage xml -o coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=tundzai001
            -Dsonar.projectKey=tundzai001_esp32-base
