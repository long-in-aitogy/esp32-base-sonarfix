sonar.sources=src,include,docs,.github
sonar.tests=test,docs/test_render_catalogues.py
sonar.exclusions=docs/test_render_catalogues.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverageReportPaths=cpp-coverage.xml

sonar.issue.ignore.multicriteria=globalvar,voidparam

sonar.issue.ignore.multicriteria.globalvar.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.globalvar.resourceKey=**/*.cpp,**/*.h

sonar.issue.ignore.multicriteria.voidparam.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.voidparam.resourceKey=**/*.cpp,**/*.h